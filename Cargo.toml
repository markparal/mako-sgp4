[package]
name = "mako-sgp4"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = [
    "Mark Paral",
]
description = "Theory-based SGP4 propagator for TLEs and OMMs"
readme = "README.md"
homepage = "https://github.com/markparal/mako-sgp4"
repository = "https://github.com/markparal/mako-sgp4"
license = "MIT"
keywords = [
    "satellite",
    "sgp4",
    "tle",
    "omm",
    "astrodynamics",
]
categories = [
    "aerospace",
    "mathematics",
    "science",
    "parser-implementations",
]
include = [
    "/src",
    "/examples",
    "Cargo.toml",
    "/README.md",
    "/LICENSE*",
]

[workspace]
members = ["wasm"]

[lib]
name = "mako_sgp4"
path = "src/lib.rs"

[features]
default = ["xml", "json", "csv"]
xml = ["dep:roxmltree"]
json = ["dep:serde_json"]
csv = ["dep:csv"]

[dependencies]
csv = { version = "1.4.0", optional = true }
roxmltree = { version = "0.21.1", optional = true }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[example]]
name = "propagate_omm_xml"
required-features = ["xml"]

[[example]]
name = "propagate_omm_json"
required-features = ["json"]

[[example]]
name = "propagate_omm_csv"
required-features = ["csv"]

# Size-optimized release profile for the WebAssembly build (wasm-pack build --profile wasm-release)
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
